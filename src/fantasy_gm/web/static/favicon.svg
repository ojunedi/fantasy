<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="Fantasy GM">
  <title>Fantasy GM</title>
  <!-- A chyron, not a football: the dashboard's one bold element is the navy
       score bar, so the mark is that bar. Deliberately only four shapes with
       thick strokes — an earlier version had eight and turned to mush at 16px,
       which is the size that actually matters. -->
  <rect width="32" height="32" fill="#002E5D"/>

  <!-- Two scores facing each other; mine is the solid one. -->
  <rect x="4"  y="7" width="11" height="7" fill="#FFFFFF"/>
  <rect x="18" y="7" width="10" height="7" fill="#FFFFFF" opacity="0.42"/>

  <!-- The margin bar: track, then the amber marker running off centre, which
       is the one thing on the page colour is allowed to mean. -->
  <rect x="4"  y="19" width="24" height="6" fill="#FFFFFF" opacity="0.22"/>
  <rect x="16" y="19" width="10" height="6" fill="#FFC300"/>
</svg>
