[project]
name = "fantasy-gm"
version = "0.1.0"
description = "Agentic fantasy football GM"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.4.0",
    "httpx>=0.28.1",
    "langchain-google-genai>=2.0.0",
    "langchain-core>=1.6.2",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "nflreadpy>=0.1.0",
    "polars>=1.0.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "sqlite-utils>=3.35",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "langchain-groq>=1.1.3",
    "requests>=2.34.2",
    "langchain-anthropic>=1.7.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]
